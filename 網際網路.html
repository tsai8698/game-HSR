<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喜歡的遊戲｜崩壞：星穹鐵道</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body {
      font-family: "Noto Sans TC", sans-serif;
      margin: 0;
      padding: 0;
      background: #E6F0FF; /* 冰藍背景 */
      color: #1E2A4A; /* 深藍灰文字 */
    }

    header {
      background: #2F3A56; /* 深冰藍 */
      text-align: center;
      padding: 30px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    header h2 {
      margin: 0;
      font-size: 1.8em;
      letter-spacing: 3px;
      color: #E6F0FF;
    }

    section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
      gap: 20px;
    }

    nav {
      flex: 1 1 300px;
      max-width: 350px;
      background: #F8FBFF; /* 淺冰白 */
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(76, 110, 245, 0.15);
      padding: 20px;
      border: 1px solid #AAB8D3;
    }

    article {
      flex: 2 1 600px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 20px 30px;
      border: 1px solid #AAB8D3;
    }

    footer {
      background: #2F3A56;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
      font-size: 0.9em;
    }

    iframe {
      width: 100%;
      height: 200px;
      border: none;
      border-radius: 12px;
      margin-top: 5px;
    }

    img {
      width: 100%;
      border-radius: 12px;
      margin-top: 5px;
    }

    h2, h3 {
      color: #4C6EF5; /* 鏡流藍 */
    }

    /* Tabs 樣式 */
    .tabs {
      display: flex;
      justify-content: center;
      border-bottom: 2px solid #AAB8D3;
      margin-bottom: 15px;
    }

    .tab {
      padding: 10px 20px;
      cursor: pointer;
      background: #F0F4FF;
      border: 1px solid #AAB8D3;
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      margin: 0 5px;
      transition: 0.3s;
      color: #1E2A4A;
    }

    .tab:hover {
      background: #DEE8FF;
    }

    .tab.active {
      background: #6EA8FE;
      color: white;
      border-color: #6EA8FE;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.4s;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    #comparePlot, #regionPlot {
      width: 100%;
      max-width: 800px;
      margin: auto;
    }

    @media (max-width: 768px) {
      section {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

<header>
  <h2>喜歡的遊戲｜崩壞：星穹鐵道</h2>
</header>

<section>
  
<nav>
	<h3>喜歡的角色：鏡流</h3>
    
    <div style="background: #F0F4FF; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
        <p style="margin: 0; font-size: 0.95em;">
            <strong>命途：</strong>毀滅<br>
            <strong>屬性：</strong>冰<br>
            <strong>所屬：</strong>前「羅浮」劍首，雲上五驍之一<br>
            <em style="color: #6071A6;">「凡有所求，皆為所困。」</em>
        </p>
    </div>
    <div class="video-wrapper">
        <p style="font-weight: bold; margin-top: 0; font-size: 0.9em;">
            鏡流角色歌曲《劍與雪》
        </p>
        <iframe
          src="https://www.youtube.com/embed/6iLrRMXbzS0"
          title="《崩壞：星穹鐵道》鏡流歌曲《劍與雪》"
          allowfullscreen>
        </iframe>
    </div>

    <div class="nav-image">
        <p style="font-weight: bold; font-size: 0.9em;">鏡流角色美術圖</p>
        <img src="hq720.jpg" alt="崩壞：星穹鐵道 鏡流遊戲美術截圖" loading="lazy">
    </div>

    <hr style="border-top: 1px solid #AAB8D3; margin: 15px 0;">

    <ul>
        <li><a style="display: block; padding: 5px 0; color: #4C6EF5; text-decoration: none;" href="https://momo20031013-afk.github.io/momoweb/" target="_blank">鄭品均的網站 &rarr;</a></li>
        <li><a style="display: block; padding: 5px 0; color: #4C6EF5; text-decoration: none;" href="https://elaine951004-ops.github.io/weare71th/index2.html
" target="_blank">陳昕珮的網站 &rarr;</a></li>
        <li><a style="display: block; padding: 5px 0; color: #4C6EF5; text-decoration: none;" href="https://a6706976-5455.github.io/the-internet-homework/" target="_blank">李銘諺的網站 &rarr;</a></li>
        <li><a style="display: block; padding: 5px 0; color: #4C6EF5; text-decoration: none;" href="https://hsr.hoyoverse.com/zh-tw/home" target="_blank">官方網站 &rarr;</a></li>
    </ul>
</nav>

  <article>
    <h2>📊 遊戲數據分析</h2>

    <div class="tabs">
      <div class="tab active" data-target="compare">三款遊戲比較</div>
      <div class="tab" data-target="region">地區玩家分布</div>
    </div>

    <div id="compare" class="tab-content active">
      <p>
        下方圖表比較了《原神》《崩壞：星穹鐵道》和《絕區零》三款米哈遊遊戲的全球玩家估計值。
      </p>
      <div id="comparePlot"></div>
    </div>

    <div id="region" class="tab-content">
      <p>
        以下顯示《崩壞：星穹鐵道》於全球主要地區的玩家分布比例。
      </p>
      <div id="regionPlot"></div>
    </div>

    <h3>數據說明</h3>
    <p>
      本數據為市場分析師估計值，單位為百萬人次。
    </p>
  </article>
</section>

<footer>
  <p>© 2025 鏡流主題頁面 | 僅供展示用途</p>
</footer>

<script>
  // ---- Tabs 切換 ----
  const tabs = document.querySelectorAll('.tab');
  const contents = document.querySelectorAll('.tab-content');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      contents.forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.target).classList.add('active');
    });
  });

 
  const data2 = [{
    x: ["原神 (Genshin Impact)", "崩壞：星穹鐵道 (HSR)", "絕區零 (ZZZ)"],
    y: [180, 100, 60],
    type: "bar",
    marker: {
      color: ["#ffb347", "#76a4ff", "#d58aff"]
    }
  }];

  const layout2 = {
    title: {
      text: "<b>米哈遊三款遊戲全球玩家規模比較</b><br>(單位：百萬)",
      font: { size: 18 }
    },
    xaxis: { title: "遊戲名稱" },
    yaxis: { title: "玩家規模 (百萬)", range: [0, 200] },
    margin: { t: 70, b: 70, l: 60, r: 20 },
    plot_bgcolor: "#fff",
    paper_bgcolor: "#fff"
  };

  Plotly.newPlot("comparePlot", data2, layout2, { responsive: true });

  
  const data3 = [{
    labels: ["亞洲", "歐洲", "北美", "南美", "其他"],
    values: [45, 25, 20, 5, 5],
    type: "pie",
    textinfo: "label+percent",
    marker: {
      colors: ["#76a4ff", "#9bc7ff", "#ffcf6f", "#ffb5d8", "#b8a6ff"]
    }
  }];

  const layout3 = {
    title: {
      text: "<b>《崩壞：星穹鐵道》全球玩家分布比例</b>",
      font: { size: 18 }
    },
    height: 400
  };

  Plotly.newPlot("regionPlot", data3, layout3, { responsive: true });


  window.addEventListener('resize', () => {
    Plotly.Plots.resize('comparePlot');
    Plotly.Plots.resize('regionPlot');
  });
</script>

</body>
</html>
